<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanksgiving Spelling Bee</title>
<meta name="description" content="A sparkly Thanksgiving spelling bee to show on the TV during a party game.">
<meta name="theme-color" content="#ff4fa3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ff3d9a' d='M50 88C20 66 6 48 6 30 6 16 17 6 30 6c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 18-14 36-44 58z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="s-heart" viewBox="0 0 100 100"><path fill="currentColor" d="M50 88C20 66 6 48 6 30 6 16 17 6 30 6c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 18-14 36-44 58z"/></symbol>
    <symbol id="s-sparkle" viewBox="0 0 100 100"><path fill="currentColor" d="M50 0C54 34 66 46 100 50 66 54 54 66 50 100 46 66 34 54 0 50 34 46 46 34 50 0z"/></symbol>
    <symbol id="s-leaf" viewBox="0 0 100 100"><path fill="currentColor" d="M50 4C78 20 92 48 74 76 66 88 56 92 50 96 44 92 34 88 26 76 8 48 22 20 50 4z"/><path d="M50 18v80M50 50l-14-12M50 50l14-12M50 70l-12-10M50 70l12-10" stroke="rgba(0,0,0,.18)" stroke-width="4" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="s-pumpkin" viewBox="0 0 100 100"><path d="M50 20c0-8 4-14 10-16" stroke="#5c7a2a" stroke-width="7" stroke-linecap="round" fill="none"/><ellipse cx="30" cy="58" rx="22" ry="30" fill="#ff8a2b"/><ellipse cx="70" cy="58" rx="22" ry="30" fill="#ff8a2b"/><ellipse cx="50" cy="58" rx="22" ry="33" fill="#ffa040"/><path d="M40 34c-4 14-4 34 0 52M60 34c4 14 4 34 0 52" stroke="#e8701c" stroke-width="3" fill="none"/><ellipse cx="42" cy="44" rx="5" ry="9" fill="#ffd08a" opacity=".7"/></symbol>
    <symbol id="s-pie" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e9a54e"/><circle cx="50" cy="50" r="38" fill="#e2762b"/><circle cx="50" cy="50" r="46" fill="none" stroke="#c9822f" stroke-width="5" stroke-dasharray="9 6"/><path fill="#fff7fb" d="M50 64C38 56 32 49 32 42c0-6 4-10 9-10 4 0 7 2 9 5 2-3 5-5 9-5 5 0 9 4 9 10 0 7-6 14-18 22z"/></symbol>
    <symbol id="s-turkey" viewBox="0 0 100 100"><g transform="translate(50 62)"><ellipse rx="10" ry="34" fill="#ff5fae" transform="rotate(-60) translate(0 -18)"/><ellipse rx="10" ry="34" fill="#b98bff" transform="rotate(-30) translate(0 -18)"/><ellipse rx="10" ry="34" fill="#ffcf4d" transform="translate(0 -18)"/><ellipse rx="10" ry="34" fill="#ff8a2b" transform="rotate(30) translate(0 -18)"/><ellipse rx="10" ry="34" fill="#ff3d9a" transform="rotate(60) translate(0 -18)"/></g><circle cx="50" cy="64" r="22" fill="#8b4a2b"/><circle cx="50" cy="42" r="13" fill="#a35a35"/><circle cx="45" cy="40" r="3" fill="#fff"/><circle cx="55" cy="40" r="3" fill="#fff"/><circle cx="45" cy="40" r="1.5" fill="#2a0a33"/><circle cx="55" cy="40" r="1.5" fill="#2a0a33"/><path d="M46 46h8l-4 6z" fill="#ffcf4d"/><ellipse cx="53" cy="53" rx="2.5" ry="5" fill="#ff2d55"/><circle cx="40" cy="70" r="3" fill="#ff9ccf"/><circle cx="60" cy="70" r="3" fill="#ff9ccf"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="10" cy="17" r="2.6" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="bg" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main id="stage">
  <header class="top">
    <div class="brand">
      <svg class="brand-turkey" aria-hidden="true"><use href="#s-turkey"/></svg>
      <div class="brand-text">
        <span class="brand-small">Thanksgiving</span>
        <span class="brand-big">Spelling Bee</span>
      </div>
    </div>
    <div class="meta">
      <span id="chip" class="chip">Easy</span>
      <span id="count" class="count">1 / 131</span>
    </div>
    <div id="timer" class="timer ok" role="timer" aria-live="off">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"/>
        <circle id="ringProg" class="ring-prog" cx="60" cy="60" r="52"/>
      </svg>
      <div class="time-inner">
        <span id="timeNum" class="time-num">30</span>
        <span id="timeLabel" class="time-label">ready</span>
      </div>
    </div>
  </header>

  <section class="word-wrap" id="wordWrap">
    <div id="word" class="word" aria-live="polite"></div>
  </section>

  <section class="cards">
    <article class="card">
      <span class="card-label">Definition</span>
      <p id="def" class="card-text"></p>
    </article>
    <article class="card">
      <span class="card-label">Use it in a sentence</span>
      <p id="sent" class="card-text sentence"></p>
    </article>
  </section>
</main>

<div id="timesup" class="timesup" hidden>
  <div class="timesup-inner">
    <div class="timesup-text">TIME'S UP!</div>
    <div class="timesup-sub">Let's check that spelling, superstar</div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav id="dock" class="dock" aria-label="Controls">
  <button class="btn" data-act="prev" title="Previous word (Left arrow)" aria-label="Previous word"><svg><use href="#i-prev"/></svg></button>
  <button class="btn btn-big" id="playBtn" data-act="toggle" title="Start / pause timer (Space)" aria-label="Start timer"><svg><use id="playIcon" href="#i-play"/></svg></button>
  <button class="btn" data-act="reset" title="Reset timer" aria-label="Reset timer"><svg><use href="#i-reset"/></svg></button>
  <button class="btn" data-act="next" title="Next word (Right arrow)" aria-label="Next word"><svg><use href="#i-next"/></svg></button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button class="btn btn-pill" data-act="reveal" title="Reveal / spell it out (R)"><svg><use href="#s-sparkle"/></svg><span>Reveal</span></button>
  <button class="btn" data-act="shuffle" title="Shuffle (S)" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
  <button class="btn" data-act="panel" id="panelBtn" title="Settings" aria-label="Settings" aria-expanded="false"><svg><use href="#i-gear"/></svg></button>
  <button class="btn" data-act="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
</nav>

<aside id="panel" class="panel" hidden aria-label="Settings">
  <div class="panel-row">
    <div class="panel-title">Timer</div>
    <div class="seg" id="presets">
      <button data-preset="15">15s</button><button data-preset="30">30s</button><button data-preset="45">45s</button><button data-preset="60">60s</button><button data-preset="90">90s</button>
    </div>
    <div class="stepper">
      <button data-act="minus" aria-label="Five seconds less">-5</button>
      <span id="durVal">30 s</span>
      <button data-act="plus" aria-label="Five seconds more">+5</button>
    </div>
  </div>
  <div class="panel-row">
    <div class="panel-title">Words</div>
    <div class="seg" id="filters">
      <button data-filter="all">All</button><button data-filter="easy">Easy</button><button data-filter="medium">Medium</button><button data-filter="hard">Hard</button>
    </div>
    <div class="seg">
      <button data-act="shuffle">Shuffle</button><button data-act="inorder">In order</button>
    </div>
  </div>
  <div class="panel-row toggles">
    <button class="toggle" data-toggle="hideMode"><span class="knob"></span>Hide the word (H)</button>
    <button class="toggle" data-toggle="spellOut"><span class="knob"></span>Spell it out letter by letter</button>
    <button class="toggle" data-toggle="autoAdvance"><span class="knob"></span>Auto-advance when time is up</button>
    <button class="toggle" data-toggle="sound"><span class="knob"></span>Time's up sound</button>
  </div>
  <div class="panel-row keys">
    <span><kbd>Space</kbd> start / pause</span>
    <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> prev / next</span>
    <span><kbd>R</kbd> reveal</span>
    <span><kbd>H</kbd> hide mode</span>
    <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> timer +/- 5 s</span>
    <span><kbd>S</kbd> shuffle</span>
    <span><kbd>F</kbd> fullscreen</span>
    <span><kbd>0</kbd> reset timer</span>
  </div>
</aside>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
